@if (mostrarModal()){
  <div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h2>Nova Requisição</h2>
    <form id="req-form">
      <div class="form-group">
        <label for="req-name">Nome da Requisição</label>
        <input type="text" id="req-name" name="nome" placeholder="Ex: Solicitação de Acesso" [(ngModel)]="nome" required>
      </div>
      <div class="form-group">
        <label for="req-type">Setor</label>
        <select id="req-type" name="setor"  [(ngModel)]="setor" required>
          <option value="" disabled selected>Selecione o setor</option>
          <option value="TI">TI</option>
          <option value="Financeiro">Financeiro</option>
          <option value="RH">Recursos Humanos</option>
          <option value="Compras">Compras</option>
          <option value="Jurídico">Jurídico</option>
          <option value="Marketing">Marketing</option>
          <option value="Logística">Logística</option>
          <option value="Operações">Operações</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <div class="modal-buttons">
        <button type="button" id="close-modal" class="cancel-btn" (click)="Esconder()">Cancelar</button>
        <button type="submit" class="send-btn" (click)="Enviar()">Enviar</button>
      </div>
    </form>
  </div>
</div>
}
